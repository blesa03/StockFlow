{% extends "base.html" %}

{% block body_class %}app-body{% endblock %}

{% block body %}

<div class="app-shell">

    {% include "partials/app_header.html" %}

    <main class="app-content">

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div
                        class="
                            message
                            message--{{ message.tags|default:'info' }}
                        "
                    >
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}

    </main>

</div>

{% endblock %}
